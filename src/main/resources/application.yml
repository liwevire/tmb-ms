server:
  port: 6080
  servlet:
   context-path: /api
spring:
  datasource:
    url: jdbc:sqlite:bank.db
    username:
    password:
  jpa:
    show-sql: false
    hibernate.ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLiteDialect
  output:
    ansi:
      enabled: always
logging:
  file:
    name: ./logs/tmb-ms.log
  level:
    '[org.springframework.level]': info
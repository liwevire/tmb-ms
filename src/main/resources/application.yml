server:
  port: 6080
  servlet:
   context-path: /api
spring:
  datasource:
    url: jdbc:sqlite:bank.db
    username:
    password:
    hikari:
      maximum-pool-size: 3
  jpa:
    show-sql: false
    hibernate.ddl-auto: none
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  output:
    ansi:
      enabled: always
logging:
  file:
    name: ./logs/tmb-ms.log
  level:
    '[org.springframework.level]': info
loan-status-open: open
loan-status-closed: closed
loan-status-other: other
gold-rate-url: https://www.livechennai.com/gold_silverrate.asp